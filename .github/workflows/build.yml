name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: roothide
            archs: "arm64 arm64e"
            expected_arch: iphoneos-arm64e
          - scheme: rootless
            archs: "arm64 arm64e"
            expected_arch: iphoneos-arm64
    env:
      ROOTHIDE_THEOS_COMMIT: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
    steps:
      - name: Check out dotto17
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Configure build environment
        shell: bash
        run: echo "THEOS=$RUNNER_TEMP/roothide-theos" >> "$GITHUB_ENV"

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          set -euo pipefail
          version_count=$(awk '$1 == "Version:" { count++ } END { print count + 0 }' control)
          version=$(awk '$1 == "Version:" && NF == 2 { print $2 }' control)
          test "$version_count" -eq 1
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check out pinned RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$ROOTHIDE_THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$ROOTHIDE_THEOS_COMMIT"

      - name: Build debug package (${{ matrix.scheme }})
        run: make clean package THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} ARCHS="${{ matrix.archs }}" PACKAGE_VERSION="${{ steps.package-version.outputs.version }}"

      - name: Verify package metadata
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: scripts/verify_package.sh

      - name: Record artifact hashes
        shell: bash
        run: |
          cd packages
          shasum -a 256 ./*.deb | tee SHA256SUMS

      - name: Upload debug artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dottoplusplus-${{ matrix.scheme }}-${{ steps.package-version.outputs.version }}-debug
          path: |
            packages/*.deb
            packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish-dev:
    # Development branch pushes go straight to the dev repo; main is for
    # releases (tagged, published separately).
    if: github.ref == 'refs/heads/development'
    needs: build-and-package
    runs-on: ubuntu-latest
    env:
      REPO_DEPLOY_KEY: ${{ secrets.REPO_DEPLOY_KEY }}
    steps:
      - name: Check out dotto17
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Read package version
        id: source-version
        shell: bash
        run: |
          set -euo pipefail
          version_count=$(awk '$1 == "Version:" { count++ } END { print count + 0 }' control)
          version=$(awk '$1 == "Version:" && NF == 2 { print $2 }' control)
          test "$version_count" -eq 1
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Download built packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: dottoplusplus-*-debug
          merge-multiple: true
          path: packages

      - name: Publish to dev repo
        env:
          EXPECTED_VERSION: ${{ steps.source-version.outputs.version }}
        run: |
          DEBS="$(ls packages/*.deb | tr '\n' ' ')" \
          scripts/publish_repo.sh

      - name: Verify development feed publication
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.source-version.outputs.version }}
        run: |
          set -euo pipefail
          # GitHub Pages can lag behind the repo push; verify the source feed
          # immediately, then let the Pages CDN catch up asynchronously.
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "https://raw.githubusercontent.com/hadobedo/repo/main/dev/Packages?commit=${GITHUB_SHA}" \
            > /tmp/dotto-dev-Packages
          grep -F 'Package: com.nicksworks.dottoplusplus' /tmp/dotto-dev-Packages
          grep -F "Version: ${EXPECTED_VERSION}" /tmp/dotto-dev-Packages
          grep -F 'Architecture: iphoneos-arm64' /tmp/dotto-dev-Packages
          grep -F 'Architecture: iphoneos-arm64e' /tmp/dotto-dev-Packages
          grep -F 'Icon: https://hadobedo.github.io/repo/assets/dottoplusplus.png' /tmp/dotto-dev-Packages
          grep -F 'SileoDepiction: https://hadobedo.github.io/repo/depictions/com.nicksworks.dottoplusplus.json' /tmp/dotto-dev-Packages
          grep -F 'Depiction: https://hadobedo.github.io/repo/depictions/com.nicksworks.dottoplusplus.html' /tmp/dotto-dev-Packages
          for path in \
            assets/dottoplusplus.png \
            depictions/com.nicksworks.dottoplusplus.json \
            depictions/com.nicksworks.dottoplusplus.html \
            dev/assets/dottoplusplus.png \
            dev/depictions/com.nicksworks.dottoplusplus.json \
            dev/depictions/com.nicksworks.dottoplusplus.html; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 \
              "https://raw.githubusercontent.com/hadobedo/repo/main/$path?commit=${GITHUB_SHA}" \
              >/dev/null
          done
          echo 'development feed repository publication verified'
          echo 'development feed URL: https://hadobedo.github.io/repo/dev/'
