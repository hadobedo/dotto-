name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_count=$(awk '$1 == "Version:" { count++ } END { print count + 0 }' control)
          version=$(awk '$1 == "Version:" && NF == 2 { print $2 }' control)
          test "$version_count" -eq 1
          test -n "$version"
          tag="v$version"
          git fetch origin --tags --force
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_commit=$(git rev-list -n 1 "refs/tags/$tag")
            test "$tagged_commit" = "$GITHUB_SHA" || {
              echo "$tag already points to $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            }
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build-release:
    needs: prepare-release
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: roothide
            archs: "arm64 arm64e"
            expected_arch: iphoneos-arm64e
          - scheme: rootless
            archs: "arm64 arm64e"
            expected_arch: iphoneos-arm64
    env:
      ROOTHIDE_THEOS_COMMIT: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
    steps:
      - name: Check out release source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Require release commit from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Refusing to publish: $GITHUB_SHA is not contained in origin/main" >&2
            exit 1
          fi

      - name: Configure build environment
        shell: bash
        run: echo "THEOS=$RUNNER_TEMP/roothide-theos" >> "$GITHUB_ENV"

      - name: Check out pinned RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$ROOTHIDE_THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$ROOTHIDE_THEOS_COMMIT"

      - name: Build release package (${{ matrix.scheme }})
        run: |
          make clean package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} \
            ARCHS="${{ matrix.archs }}" \
            PACKAGE_VERSION="${{ needs.prepare-release.outputs.version }}"

      - name: Verify package metadata
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          EXPECT_RELEASE: 1
        run: scripts/verify_package.sh

      - name: Record artifact hashes
        shell: bash
        run: |
          cd packages
          shasum -a 256 ./*.deb | tee SHA256SUMS

      - name: Upload release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.scheme }}
          path: |
            packages/*.deb
            packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-repository:
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: source
          fetch-depth: 1

      - name: Download release packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          merge-multiple: false

      - name: Configure repository deploy key
        shell: bash
        env:
          REPO_DEPLOY_KEY: ${{ secrets.REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$REPO_DEPLOY_KEY" > "$HOME/.ssh/repo-deploy"
          chmod 600 "$HOME/.ssh/repo-deploy"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"
          printf '%s\n' 'Host github.com' >> "$HOME/.ssh/config"
          printf '%s\n' '  IdentityFile ~/.ssh/repo-deploy' >> "$HOME/.ssh/config"
          printf '%s\n' '  IdentitiesOnly yes' >> "$HOME/.ssh/config"

      - name: Check out package repository
        shell: bash
        run: git clone git@github.com:hadobedo/repo.git feed

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dpkg-dev

      - name: Update package indexes
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir -p feed/assets feed/depictions feed/debs feed/rootless/debs feed/roothide/debs
          cp source/dottoPlusPlusPrefs/Resources/icon@3x.png feed/assets/dottoplusplus.png
          cp source/dottoPlusPlusPrefs/Resources/icon@3x.png feed/RepoIcon.png
          cp source/dottoPlusPlusPrefs/Resources/icon@3x.png feed/CydiaIcon.png
          python3 source/scripts/render_repo_depiction.py \
            --output-dir feed/depictions \
            --version "$version" \
            --base-url "https://hadobedo.github.io/repo"

          for scheme in rootless roothide; do
            artifact="release-$scheme"
            package=$(find "$artifact" -maxdepth 1 -type f -name '*.deb' -print -quit)
            test -n "$package"
            cp "$package" "feed/debs/"
            cp "$package" "feed/$scheme/debs/"
            cp "$artifact/SHA256SUMS" "feed/$scheme/SHA256SUMS"
          done

          write_release() {
            local directory=$1
            local architectures=$2
            local codename=$3
            local package_file=Packages
            local compressed_file=Packages.gz

            (
              cd "$directory"
              dpkg-scanpackages -m debs /dev/null > Packages
              gzip -9c Packages > Packages.gz
              {
                printf 'Origin: Nicks Works\n'
                printf 'Label: Nicks Works\n'
                printf 'Suite: stable\n'
                printf 'Codename: %s\n' "$codename"
                printf 'Architectures: %s\n' "$architectures"
                printf 'Components: main\n'
                printf 'Description: dotto++ package feed\n'
                printf 'MD5Sum:\n'
                while read -r hash file; do
                  printf ' %s %s %s\n' "$hash" "$(stat -c '%s' "$file")" "$file"
                done < <(md5sum "$package_file" "$compressed_file")
                printf 'SHA256:\n'
                while read -r hash file; do
                  printf ' %s %s %s\n' "$hash" "$(stat -c '%s' "$file")" "$file"
                done < <(sha256sum "$package_file" "$compressed_file")
              } > Release
            )
          }

          write_release feed 'iphoneos-arm64 iphoneos-arm64e' stable
          write_release feed/rootless iphoneos-arm64 rootless
          write_release feed/roothide iphoneos-arm64e roothide

          printf '%s\n' "$version" > feed/LATEST

      - name: Commit and publish package repository
        id: publish-feed
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          cd feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Publish dotto++ $version"
          git push origin main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify stable feed publication
        shell: bash
        env:
          FEED_COMMIT: ${{ steps.publish-feed.outputs.commit }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          python3 - "$FEED_COMMIT" "$version" \
            release-rootless release-roothide <<'PY'
          import hashlib
          import os
          import sys
          import urllib.request

          commit, version, rootless_dir, roothide_dir = sys.argv[1:]
          base = f"https://raw.githubusercontent.com/hadobedo/repo/{commit}"

          def fields(text):
              result = {}
              for line in text.splitlines():
                  if ": " in line:
                      key, value = line.split(": ", 1)
                      result[key] = value
                      if key.lower() == "sileodepiction":
                          result["SileoDepiction"] = value
              return result

          def stanzas(text):
              return [fields(block) for block in text.split("\n\n") if block.strip()]

          def verify(index_path, artifact_dir, architecture):
              index = urllib.request.urlopen(f"{base}/{index_path}", timeout=30).read().decode()
              artifact = next(name for name in os.listdir(artifact_dir) if name.endswith(".deb"))
              artifact_path = os.path.join(artifact_dir, artifact)
              expected_hash = hashlib.sha256(open(artifact_path, "rb").read()).hexdigest()
              matches = [item for item in stanzas(index)
                         if item.get("Package") == "com.nicksworks.dottoplusplus"
                         and item.get("Version") == version
                         and item.get("Architecture") == architecture]
              assert len(matches) == 1, (index_path, architecture, len(matches))
              item = matches[0]
              assert item.get("Filename") == f"debs/{artifact}", item
              assert item.get("SHA256") == expected_hash, (item, expected_hash)
              assert int(item.get("Size", "-1")) == os.path.getsize(artifact_path), item
              assert item.get("Icon") == "https://hadobedo.github.io/repo/assets/dottoplusplus.png", item
              assert item.get("SileoDepiction") == "https://hadobedo.github.io/repo/depictions/com.nicksworks.dottoplusplus.json", item
              assert item.get("Depiction") == "https://hadobedo.github.io/repo/depictions/com.nicksworks.dottoplusplus.html", item
              print(f"verified {index_path}: {artifact} ({architecture}) {expected_hash}")

          verify("Packages", rootless_dir, "iphoneos-arm64")
          verify("Packages", roothide_dir, "iphoneos-arm64e")
          verify("rootless/Packages", rootless_dir, "iphoneos-arm64")
          verify("roothide/Packages", roothide_dir, "iphoneos-arm64e")

          for path in (
              "assets/dottoplusplus.png",
              "depictions/com.nicksworks.dottoplusplus.json",
              "depictions/com.nicksworks.dottoplusplus.html",
              "Packages",
              "rootless/Packages",
              "roothide/Packages",
          ):
              data = urllib.request.urlopen(f"{base}/{path}", timeout=30).read()
              assert data, path
          depiction = urllib.request.urlopen(
              f"{base}/depictions/com.nicksworks.dottoplusplus.json", timeout=30
          ).read().decode()
          assert '"tabname": "Changelog"' in depiction
          assert '1.1.1' in depiction
          PY

  create-github-release:
    # Attach the built rootless + roothide debs (and checksums) to a GitHub
    # Release only after the production-gated stable feed has published and
    # its artifact-specific verification has passed.
    needs: [prepare-release, publish-repository]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          merge-multiple: false

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          : > assets/SHA256SUMS
          for scheme in rootless roothide; do
            package=$(find "release-$scheme" -maxdepth 1 -type f -name '*.deb' -print -quit)
            test -n "$package"
            recorded=$(awk -v file="$(basename "$package")" '$2 == file { print $1 }' "release-$scheme/SHA256SUMS")
            actual=$(sha256sum "$package" | awk '{ print $1 }')
            test -n "$recorded" && test "$recorded" = "$actual"
            cp "$package" assets/
            { printf '[%s]\n' "$scheme"; printf '%s  %s\n' "$actual" "$(basename "$package")"; } >> assets/SHA256SUMS
          done
          test "$(find assets -name '*.deb' | wc -l)" -eq 2

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          tag="v$version"
          changes="$(python3 - "$version" CHANGELOG.md <<'PY'
          import sys
          version, path = sys.argv[1:]
          lines = open(path, encoding="utf-8").read().splitlines()
          headings = (f"## {version}", f"## [{version}]")
          start = next((i for i, line in enumerate(lines) if line.strip() in headings), None)
          if start is None:
              raise SystemExit(f"missing CHANGELOG.md section for {version}")
          end = next((i for i in range(start + 1, len(lines))
                      if lines[i].startswith("## ")), len(lines))
          body = "\n".join(lines[start + 1:end]).strip()
          if not body:
              raise SystemExit(f"empty CHANGELOG.md section for {version}")
          print(body)
          PY
          )"
          {
            printf '## dotto++ %s\n\n' "$version"
            printf 'Minimalistic notification dots for iOS 15-17, rebuilt for rootless/roothide jailbreaks.\n'
            printf 'Rootless rewrite of the original dotto+ by ConorTheDev & Mirac.\n\n'
            printf '### Install\n'
            printf 'Add https://hadobedo.github.io/repo to Sileo or Zebra, then install dotto++.\n'
            printf 'Requires iOS 15-17 on a rootless/roothide jailbreak.\n\n'
            printf '### Changes\n\n%s\n\n' "$changes"
            printf '### Checksums\n\n'
            cat assets/SHA256SUMS
          } > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --clobber
            gh release edit "$tag" \
              --latest \
              --title "dotto++ $version" \
              --notes-file release-notes.md
          else
            gh release create "$tag" assets/* \
              --target "$GITHUB_SHA" \
              --latest \
              --title "dotto++ $version" \
              --notes-file release-notes.md
          fi

      - name: Verify latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          test "$latest_tag" = "v$RELEASE_VERSION"
          echo "latest GitHub release verified: $latest_tag"
